<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#052F42">
<title>Sem ligação · EDCycling</title>
<style>
  html,body{margin:0;height:100%;background:#052F42;color:#EAF3F6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left));box-sizing:border-box;max-width:520px;margin:0 auto}
  h1{margin:0;font:italic 800 44px/1 "Arial Narrow",Arial,sans-serif;text-transform:uppercase}
  h1 span{color:#F0609A}
  p{margin:0;line-height:1.55;color:#9FC0CD}
  .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#316287,#8A6FA8 52%,#E3407A);width:120px}
  button{align-self:flex-start;margin-top:8px;border:0;border-radius:8px;padding:10px 18px;font:600 15px system-ui,sans-serif;background:#E3407A;color:#fff}
</style>
</head>
<body>
<main>
  <h1>ED<span>Cycling</span></h1>
  <div class="bar"></div>
  <p><b style="color:#EAF3F6">Estás sem ligação à internet.</b></p>
  <p>Assim que a rede voltar, tenta outra vez para veres os eventos e treinos da equipa.</p>
  <button onclick="location.reload()">Tentar outra vez</button>
</main>
</body>
</html>
